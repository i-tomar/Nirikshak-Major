# ==============================================================================
# NIRIKSHAK AI — SIH26146 Docker Compose Deployment
# AI-Powered Monitoring & Analysis of Bitcoin Transaction Traffic
# Offline Linux & Native Container Architecture
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nirikshak-backend:latest
    container_name: nirikshak_backend
    restart: unless-stopped
    volumes:
      - data:/app/data
      - models:/app/models
      - cases:/app/cases
      - ./backend/data/external:/app/data/external:ro
      - ./backend/data/geoip:/app/data/geoip:ro
    environment:
      - PYTHONUNBUFFERED=1
      - NIRIKSHAK_ENABLE_DOCS=${NIRIKSHAK_ENABLE_DOCS:-0}
      - NIRIKSHAK_CORS_ORIGINS=${NIRIKSHAK_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - nirikshak-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nirikshak-frontend:latest
    container_name: nirikshak_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nirikshak-network

      - web-ingress

networks:
  web-ingress: {}
  nirikshak-network:
    driver: bridge
    internal: true

volumes:
  data:
  models:
  cases:
